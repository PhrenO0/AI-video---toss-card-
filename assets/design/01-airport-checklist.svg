  <text x="96" y="500" fill="#E8A33D" font-size="30" font-weight="700">01</text>
  <text x="180" y="500" fill="#F2EEE6" font-size="36" font-weight="400">入国審査</text>

  <text x="96" y="588" fill="#E8A33D" font-size="30" font-weight="700">02</text>
